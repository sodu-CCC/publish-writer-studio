<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233b5bdb'/%3E%3Cpath d='M9.6 23.7L22.4 9' stroke='%23fff' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E" />
<meta charset="UTF-8" />
<style>
  :root{ --line:#e3e6ea; --ink:#1f2328; --ink3:#8b949e; --accent:#3b5bdb; }
  @media (prefers-color-scheme: dark){ :root{ --line:#2c3038; --ink:#e6e8eb; --ink3:#6e7681; --accent:#7a90ff; } }
  body{width:300px;margin:0;font:13px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       color:var(--ink);background:transparent;padding:12px}
  h3{margin:0;font-size:14px}
  .brandline{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .brandline .logo{width:20px;height:20px;flex:0 0 20px}
  .stats{display:flex;gap:14px;color:var(--ink3);font-size:12px;margin-bottom:10px}
  .stats b{display:block;color:var(--ink);font-size:16px}
  textarea{width:100%;height:70px;resize:vertical;border:1px solid var(--line);border-radius:6px;
           background:transparent;color:var(--ink);padding:6px;font:inherit}
  .row{display:flex;gap:6px;margin-top:8px}
  button{flex:1;font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;cursor:pointer;
         background:transparent;color:var(--ink)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .hint{color:var(--ink3);font-size:11px;margin-top:8px}
</style>
</head>
<body>
<div class="brandline">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="1.2" y="1.2" width="29.6" height="29.6" rx="7" fill="#3b5bdb"/>
      <path d="M9.6 23.7L22.4 9" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M8.2 25.1l4.6-.7" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <h3>码字工坊</h3>
  </div>
  <div class="stats">
    <span>今日<b id="today">0</b></span>
    <span>作品<b id="bookCount">0</b></span>
    <span>灵感<b id="inboxCount">0</b></span>
  </div>
  <textarea id="note" placeholder="快速记一条灵感……"></textarea>
  <div class="row">
    <button class="primary" id="saveNote">保存灵感</button>
    <button id="openSide">侧边栏</button>
  </div>
  <div class="row"><button id="openApp">打开完整工作台</button></div>
  <p class="hint">数据仅保存在本机浏览器；不联网、不上传。</p>
  <script type="module" src="popup.js"></script>
</body>
</html>
